# SceneMaker CI
#
# Covers SceneMaker.Core, SceneMaker.Cli and the Core test suite: everything
# that builds without a Godot installation. TreatWarningsAsErrors is set in
# every csproj, so a single warning fails the pipeline.
#
# Deliberately NOT covered, because both need a local Godot Mono install and
# remain the manual verification steps from AGENTS.md:
#
#   dotnet build SceneMaker.csproj
#   /Applications/Godot_mono.app/Contents/MacOS/Godot --headless --path . --editor --quit
#   tests/test_headless_start.sh

stages:
  - verify

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

core:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:9.0
  cache:
    key: nuget-net9
    paths:
      - .nuget/packages
  script:
    - dotnet restore src/SceneMaker.Cli/SceneMaker.Cli.csproj
    - dotnet restore tests/SceneMaker.Core.Tests/SceneMaker.Core.Tests.csproj
    - dotnet build src/SceneMaker.Cli/SceneMaker.Cli.csproj --configuration Release --no-restore
    - >-
      dotnet test tests/SceneMaker.Core.Tests/SceneMaker.Core.Tests.csproj
      --configuration Release --no-restore
      --logger "trx;LogFileName=core-tests.trx"
      --results-directory "$CI_PROJECT_DIR/test-results"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
